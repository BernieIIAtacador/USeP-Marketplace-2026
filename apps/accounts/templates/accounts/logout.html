{% extends 'base.html' %}
{% load static %}

{% block title %}Signed out | USeP Marketplace{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/logout.css' %}">
{% endblock %}

{% block content %}
<main class="logout-page">
    <section class="logout-panel">
        <img src="{% static 'images/site-logo.png' %}" alt="USeP Marketplace logo" class="logout-logo">
        <p class="eyebrow">USeP Marketplace</p>
        <h1>You are signed out.</h1>
        <p class="logout-copy">Your account has been securely logged out.</p>
        <a class="btn btn-primary" href="{% url 'login' %}">Return to login</a>
    </section>
</main>
{% endblock %}
